apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-app
spec:
  workspaces:
    - name: source
  steps:
    - name: npm-install-and-build
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        #Connect to nexus
        #npm config set registry http://host.minikube.internal:8081/repository/npm-proxy/
        #Install dependencies
        npm install
        #Build app