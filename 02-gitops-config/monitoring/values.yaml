kube-prometheus-stack:
  alertmanager:
    enabled: false

  nodeExporter:
    enabled: false

  kubeStateMetrics:
    enabled: false

  prometheusOperator:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 200Mi

  prometheus:
    prometheusSpec:
      retention: 1d
      resources:
        requests:
          memory: 200Mi
          cpu: 100m
        limits:
          memory: 512Mi

  grafana:
    adminPassword: "admin"
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 60
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.local